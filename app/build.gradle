apply plugin: 'com.android.application'

android {
    namespace 'com.familycall.app'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.familycall.app'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.0.3'
        resConfigs 'zh', 'en'
    }

    buildTypes {
        release {
            // Demo distribution: sign the release variant with the standard debug
            // key so the generated APK is directly installable. Replace this with
            // your own keystore before publishing.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}


dependencies {
    testImplementation 'junit:junit:4.13.2'
}
